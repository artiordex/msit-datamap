name: Weekly MSIT Crawler
run-name: MSIT crawler (${{ github.event.inputs.run_reason || github.event.client_payload.run_reason || github.event.action || github.event_name }})

on:
  schedule:
    - cron: '0 12 * * 5' # 매주 금요일 21:00 KST에 실행함
  workflow_dispatch:
    inputs:
      notify_slack:
        description: 'Slack incoming webhook으로 실행 결과를 알림'
        type: boolean
        required: true
        default: true
      publish_pubsub:
        description: 'Redis Pub/Sub으로 실행 결과를 발행'
        type: boolean
        required: true
        default: true
      run_reason:
        description: '수동 실행 사유'
        type: string
        required: false
        default: 'manual'
  repository_dispatch:
    types:
      - msit-weekly-crawl
      - msit-weekly-crawl-webhook
      - msit-weekly-crawl-pubsub
      - slack-msit-weekly-crawl

permissions:
  contents: read

concurrency:
  group: weekly-msit-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_CHANNEL: ${{ vars.REDIS_CHANNEL || 'msit:pipeline:events' }}
      RUN_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && 'manual' || github.event.action }}
      RUN_REASON: ${{ github.event.inputs.run_reason || github.event.client_payload.run_reason || github.event.action || github.event_name }}
      NOTIFY_SLACK: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.notify_slack != 'false' }}
      PUBLISH_PUBSUB: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.publish_pubsub == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Check data.go.kr connectivity
        shell: bash
        run: |
          echo "=== Current time ==="
          date

          echo "=== DNS lookup ==="
          getent ahosts www.data.go.kr || true

          echo "=== HTTPS connectivity test ==="
          curl -4 -L \
            --verbose \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36" \
            --write-out "\nHTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\nTOTAL_TIME=%{time_total}\n" \
            --output /dev/null \
            "https://www.data.go.kr/tcs/dss/selectDataSetList.do" || true

      - name: Run crawler
        run: node crawler/crawler_api_과기부.js

      - name: Summarize datamap
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'crawler/datamap.json';
          if (!fs.existsSync(p)) {
            fs.appendFileSync(process.env.GITHUB_ENV, 'DATAMAP_ORGS=0\nDATAMAP_FILE=0\nDATAMAP_API=0\nDATAMAP_HYBRID=0\nDATAMAP_ERRORS=1\nDATAMAP_TOTAL=0\nDATAMAP_ERROR_SUMMARY=datamap.json not found\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Datamap summary\n\n`crawler/datamap.json` 파일이 없습니다.\n');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const orgs = Array.isArray(data.organizations) ? data.organizations : [];
          const datasets = orgs.flatMap((org) => [
            ...(Array.isArray(org.file) ? org.file : []),
            ...(Array.isArray(org.api) ? org.api : []),
            ...(Array.isArray(org.datasets) ? org.datasets : []),
          ]);
          const unique = new Map();
          for (const item of datasets) {
            const key = String(item['링크'] || item.href || item['제목'] || item.title || unique.size);
            unique.set(key, item);
          }

          const items = [...unique.values()];
          const file = items.filter((item) => item['유형'] === '파일데이터').length;
          const api = items.filter((item) => item['유형'] === 'API').length;
          const hybrid = items.filter((item) => item['유형'] === 'API/파일데이터').length;
          const errorsByOrg = orgs.flatMap((org) =>
            (Array.isArray(org.errors) ? org.errors : []).map((error) => `${org.org}: ${error}`)
          );
          const errorSummary = errorsByOrg.slice(0, 10).join(' | ');

          fs.appendFileSync(process.env.GITHUB_ENV, [
            `DATAMAP_ORGS=${orgs.length}`,
            `DATAMAP_FILE=${file}`,
            `DATAMAP_API=${api}`,
            `DATAMAP_HYBRID=${hybrid}`,
            `DATAMAP_ERRORS=${errorsByOrg.length}`,
            `DATAMAP_TOTAL=${items.length}`,
            `DATAMAP_ERROR_SUMMARY=${errorSummary}`,
            '',
          ].join('\n'));

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Datamap summary',
            '',
            `- 기관: ${orgs.length}`,
            `- 파일데이터: ${file}`,
            `- API: ${api}`,
            `- API/파일데이터: ${hybrid}`,
            `- 전체 데이터셋: ${items.length}`,
            `- 오류: ${errorsByOrg.length}`,
            '',
            ...errorsByOrg.slice(0, 20).map((error) => `- ${error}`),
            '',
          ].join('\n'));
          NODE

      - name: Validate crawl result
        run: |
          if [ "${DATAMAP_TOTAL:-0}" -eq 0 ]; then
            echo "No datasets were collected. Stop before copy/build/deploy."
            exit 1
          fi

      - name: Copy latest datamap to web public
        run: node scripts/copy_datamap.js

      - name: Build web app
        run: npm run build --workspace=datamap-web

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set; skip Cloudflare deploy."
            exit 0
          fi
          npx wrangler deploy --config datamap-web/wrangler.jsonc

      - name: Upload datamap artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msit-datamap-${{ github.run_id }}
          path: |
            crawler/datamap.json
            crawler/datamap_*.json
            datamap-web/public/data/datamap.json
            datamap-web/dist
          if-no-files-found: warn

      - name: Publish Pub/Sub event (success)
        if: success() && env.PUBLISH_PUBSUB == 'true'
        run: |
          if [ -z "$REDIS_URL" ]; then
            echo "REDIS_URL secret is not set; skip pubsub publish."
            exit 0
          fi
          node scripts/redis_publisher.js \
            --channel "$REDIS_CHANNEL" \
            --status success \
            --flow weekly-crawl \
            --execution "${{ github.run_id }}" \
            --task "$RUN_SOURCE"

      - name: Publish Pub/Sub event (failure)
        if: failure() && env.PUBLISH_PUBSUB == 'true'
        run: |
          if [ -z "$REDIS_URL" ]; then
            echo "REDIS_URL secret is not set; skip pubsub publish."
            exit 0
          fi
          node scripts/redis_publisher.js \
            --channel "$REDIS_CHANNEL" \
            --status failure \
            --flow weekly-crawl \
            --execution "${{ github.run_id }}" \
            --task "$RUN_SOURCE"

      - name: Notify Slack (success)
        if: success() && env.NOTIFY_SLACK == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skip Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \":large_green_circle: *weekly-crawl* 완료\\n실행방식: \`${RUN_SOURCE}\`\\n사유: \`${RUN_REASON}\`\\n기관: \`${DATAMAP_ORGS:-0}\`, 파일: \`${DATAMAP_FILE:-0}\`, API: \`${DATAMAP_API:-0}\`, API/파일: \`${DATAMAP_HYBRID:-0}\`, errors: \`${DATAMAP_ERRORS:-0}\`\\n실행ID: \`${{ github.run_id }}\`\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions에서 보기>\"}"

      - name: Notify Slack (failure)
        if: failure() && env.NOTIFY_SLACK == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skip Slack notification."
            exit 0
          fi
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \":red_circle: *weekly-crawl* 실패\\n실행방식: \`${RUN_SOURCE}\`\\n사유: \`${RUN_REASON}\`\\n기관: \`${DATAMAP_ORGS:-0}\`, 파일: \`${DATAMAP_FILE:-0}\`, API: \`${DATAMAP_API:-0}\`, API/파일: \`${DATAMAP_HYBRID:-0}\`, errors: \`${DATAMAP_ERRORS:-0}\`\\n오류요약: \`${DATAMAP_ERROR_SUMMARY:-없음}\`\\n실행ID: \`${{ github.run_id }}\`\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 보기>\"}"
