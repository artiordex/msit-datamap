id: msit_datamap_pipeline
namespace: msit.datamap
description: GitHub Actions를 호출해 과기부 데이터맵 크롤링, Cloudflare 배포, Slack 알림, Pub/Sub 발행을 실행하는 플로

labels:
  project: msit-datamap
  owner: msit

triggers:
  - id: weekly_friday_2100_kst
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 21 * * 5"
    timezone: Asia/Seoul

inputs:
  - id: github_repository
    type: STRING
    defaults: artiordex/msit-datamap
  - id: event_type
    type: STRING
    defaults: msit-weekly-crawl
  - id: run_reason
    type: STRING
    defaults: kestra-schedule

tasks:
  - id: start_log
    type: io.kestra.plugin.core.log.Log
    message: "Start {{ flow.id }} execution={{ execution.id }} repository={{ inputs.github_repository }}"

  - id: trigger_github_actions
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/{{ inputs.github_repository }}/dispatches"
    method: POST
    contentType: application/json
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      X-GitHub-Api-Version: "2022-11-28"
    body: |
      {
        "event_type": "{{ inputs.event_type }}",
        "client_payload": {
          "run_reason": "{{ inputs.run_reason }}",
          "triggered_by": "kestra",
          "kestra_execution_id": "{{ execution.id }}"
        }
      }

  - id: done_log
    type: io.kestra.plugin.core.log.Log
    message: "GitHub Actions dispatch requested."
