id: msit_datamap_pipeline
namespace: msit.datamap
description: 과학기술정보통신부 공공데이터 수집 → 처리 → 데이터맵 배포 파이프라인

labels:
  project: msit-datamap
  owner: msit

triggers:
  - id: weekly_monday_0900_kst
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    timezone: Asia/Seoul

inputs:
  - id: project_dir
    type: STRING
    defaults: C:/식약처/data.go.kr/과기부
  - id: org_name
    type: STRING
    defaults: 과학기술정보통신부
  - id: org_code
    type: STRING
    defaults: B130007

tasks:
  - id: start_log
    type: io.kestra.plugin.core.log.Log
    message: "Start {{ flow.id }} org={{ inputs.org_name }} execution={{ execution.id }}"

  - id: crawl
    type: io.kestra.plugin.scripts.node.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - node "{{ inputs.project_dir }}/crawler/crawler_api_한국지역난방공사.js"
          --org-name "{{ inputs.org_name }}"
          --org-code "{{ inputs.org_code }}"
          --output-dir "{{ inputs.project_dir }}/crawler/data_go_kr"
    timeout: PT30M
    retry:
      type: constant
      interval: PT2M
      maxAttempts: 3
      maxDuration: PT1H
      warningOnRetry: true

  - id: build_dataset
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      PYTHONIOENCODING: utf-8
    commands:
      - python "{{ inputs.project_dir }}/scripts/build_dataset.py"
          --project-dir "{{ inputs.project_dir }}"
          --org-name "{{ inputs.org_name }}"
    timeout: PT10M

  - id: deploy_datamap
    type: io.kestra.plugin.scripts.node.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - npm --prefix "{{ inputs.project_dir }}/datamap-web" run build
      - npx wrangler deploy --config "{{ inputs.project_dir }}/datamap-web/wrangler.jsonc"
    timeout: PT10M

errors:
  - id: publish_failure
    type: io.kestra.plugin.scripts.node.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - node "{{ inputs.project_dir }}/scripts/redis_publisher.js"
          --channel msit:pipeline:events
          --status failure
          --flow "{{ flow.id }}"
          --execution "{{ execution.id }}"
          --task "{{ taskrun.id }}"

finally:
  - id: publish_result
    type: io.kestra.plugin.scripts.node.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - node "{{ inputs.project_dir }}/scripts/redis_publisher.js"
          --channel msit:pipeline:events
          --status "{{ execution.state.current == 'SUCCESS' ? 'success' : 'failure' }}"
          --flow "{{ flow.id }}"
          --execution "{{ execution.id }}"

  - id: done_log
    type: io.kestra.plugin.core.log.Log
    message: "Done {{ flow.id }} execution={{ execution.id }} state={{ execution.state.current }}"
