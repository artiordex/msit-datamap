[project]
name = "mfds-usecase-kestra"
version = "0.1.0"
description = "VS Code, Git, Python, and Kestra workflow setup for MFDS use-case automation."
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3,<3.0.4",
    "playwright>=1.42.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
usecase-pipeline = "usecase_pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usecase_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
